# Dev-specific pipeline -- triggered on develop branch
# No approval gate -- automatic deployment for fast iteration

trigger:
  branches:
    include:
      - develop
  paths:
    include:
      - environments/dev/**
      - modules/**

variables:
  - group: dev-variables
  - name: TF_VERSION
    value: '1.6.0'
  - name: WORKING_DIR
    value: environments/dev
  - name: SERVICE_CONNECTION
    value: dev-service-connection
  - name: ENVIRONMENT
    value: dev

stages:
  - stage: Validate
    jobs:
      - job: Validate
        pool: { vmImage: ubuntu-latest }
        steps:
          - task: TerraformInstaller@1
            inputs: { terraformVersion: $(TF_VERSION) }
          - script: |
              cd $(WORKING_DIR) && terraform init -backend=false && terraform validate
            displayName: Terraform validate
          - script: |
              pip install checkov
              checkov -d $(WORKING_DIR) --framework terraform --quiet
            displayName: Checkov scan

  - stage: PlanApply
    dependsOn: Validate
    jobs:
      - deployment: DevDeploy
        environment: dev
        pool: { vmImage: ubuntu-latest }
        strategy:
          runOnce:
            deploy:
              steps:
                - task: TerraformInstaller@1
                  inputs: { terraformVersion: $(TF_VERSION) }
                - task: AzureCLI@2
                  displayName: Terraform Init Plan Apply
                  inputs:
                    azureSubscription: $(SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_OIDC_TOKEN=$idToken
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      export ARM_USE_OIDC=true
                      cd $(WORKING_DIR)
                      terraform init
                      terraform plan -var-file="terraform.tfvars" -out=tfplan
                      terraform apply tfplan
